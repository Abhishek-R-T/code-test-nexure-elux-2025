version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: discount-postgres
    environment:
      POSTGRES_DB: discount_db
      POSTGRES_USER: discount_user
      POSTGRES_PASSWORD: discount_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./init-db.sql:/docker-entrypoint-initdb.d/02-init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discount_user -d discount_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      no_cache: true
    container_name: discount-app
    image: discount-app:latest
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/discount_db
      DB_USER: discount_user
      DB_PASSWORD: discount_pass
      DB_MAX_POOL_SIZE: 10
      PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
