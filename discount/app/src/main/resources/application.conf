ktor {
    deployment {
        port = 8082
        port = ${?PORT}
    }
    application {
        modules = [ io.nexure.discount.ApplicationKt.module ]
    }
}

openapi {
    swaggerFile = "openapi.yaml"
    swaggerFile = ${?OPENAPI_SPEC_FILE}
}

database {
    url = "jdbc:postgresql://localhost:5432/discount_db"
    url = ${?DB_URL}
    driver = "org.postgresql.Driver"
    user = "discount_user"
    user = ${?DB_USER}
    password = "discount_pass"
    password = ${?DB_PASSWORD}
    maxPoolSize = 10
    maxPoolSize = ${?DB_MAX_POOL_SIZE}
}
