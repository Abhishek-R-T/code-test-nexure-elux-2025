openapi: 3.0.3
info:
  title: Country-Based Product API
  description: API for managing products and discounts with country-specific VAT
  version: 1.0.0
servers:
  - url: http://localhost:8082
    description: Local development server

paths:
  /products:
    get:
      summary: Get all products for a country
      description: Returns all products for the given country with calculated final prices including VAT and discounts
      parameters:
        - name: country
          in: query
          required: true
          schema:
            type: string
            example: Sweden
          description: Country name to filter products (e.g Sweden, Germany, France)
      responses:
        '200':
          description: List of products with final prices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Invalid country parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /products/{id}/discount:
    put:
      summary: Apply discount to a product
      description: Applies a discount to a product in an idempotent manner. The same discount cannot be applied twice.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Product ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyDiscountRequest'
      responses:
        '200':
          description: Discount applied successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '304':
          description: Discount already applied (idempotent response)
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    ProductResponse:
      type: object
      required:
        - id
        - name
        - basePrice
        - country
        - discounts
        - finalPrice
      properties:
        id:
          type: string
          description: Unique product identifier
        name:
          type: string
          description: Product name
        basePrice:
          type: number
          format: double
          description: Base price before tax and discount
        country:
          type: string
          description: Country name
        discounts:
          type: array
          items:
            $ref: '#/components/schemas/Discount'
          description: List of applied discounts
        finalPrice:
          type: number
          format: double
          description: Final price including VAT and discounts

    Discount:
      type: object
      required:
        - discountId
        - percent
      properties:
        discountId:
          type: string
          description: Unique discount identifier (idempotency key)
        percent:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          maximum: 100
          description: Discount percentage (0-100, exclusive of 0)

    ApplyDiscountRequest:
      type: object
      required:
        - discountId
        - percent
      properties:
        discountId:
          type: string
          description: Unique discount identifier for idempotency
        percent:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          maximum: 100
          description: Discount percentage (0-100, exclusive of 0)

    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Error message
